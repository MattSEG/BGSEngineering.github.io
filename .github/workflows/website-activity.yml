name: Website activity checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/website-activity.test.cjs
